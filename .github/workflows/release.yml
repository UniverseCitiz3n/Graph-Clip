name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate tag and install build tools
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag '$tag' must use vMAJOR.MINOR.PATCH."
          }
          $version = $Matches[1..3] -join '.'
          $sourceVersion = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($version -ne $sourceVersion) {
            throw "Tag version '$version' does not match VERSION '$sourceVersion'."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $wixToolPath = Join-Path $env:RUNNER_TEMP 'wix-tools'
          New-Item -ItemType Directory -Force -Path $wixToolPath | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          dotnet tool install wix --version 5.0.2 --tool-path $wixToolPath
          if ($LASTEXITCODE -ne 0) {
            throw "WiX install failed with exit code $LASTEXITCODE."
          }
          "WIX_PATH=$(Join-Path $wixToolPath 'wix.exe')" >> $env:GITHUB_ENV

      - name: Run tests
        shell: pwsh
        run: |
          Invoke-Pester -Path .\GraphClip.Tests.ps1 -CI

      - name: Build MSI
        shell: pwsh
        run: |
          .\Build-GraphClipMsi.ps1 -Version $env:RELEASE_VERSION -OutputDir .\dist -SkipTests -WixPath $env:WIX_PATH

      - name: Validate MSI and checksum
        shell: pwsh
        run: |
          $msi = (Resolve-Path ".\dist\GraphClip-Setup-$env:RELEASE_VERSION.msi").Path
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = Join-Path (Split-Path $msi) 'SHA256SUMS.txt'
          Set-Content -LiteralPath $checksumFile -Value "$hash  $(Split-Path $msi -Leaf)" -Encoding ascii
          .\Test-GraphClipMsi.ps1 -MsiPath $msi -Version $env:RELEASE_VERSION -ChecksumPath $checksumFile -WixPath $env:WIX_PATH

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = ".\dist\GraphClip-Setup-$env:RELEASE_VERSION.msi"
          gh release create "$env:GITHUB_REF_NAME" $msi .\dist\SHA256SUMS.txt `
            --verify-tag --title "GraphClip $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
